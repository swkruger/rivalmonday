name: staging-refresh
# Replaces staging data with a fresh copy of cs_dev (docs/STAGING.md § Refresh): stops the Railway staging worker and
# refuses while any worker is still connected, resets the Neon `staging` branch from its parent, neutralises dev's queued
# work (infra/db/staging/after-refresh.sql), migrates to main and redeploys the worker. Manual only; shares the `staging`
# group with ci.yml `deploy-staging`. A failure after the stop leaves the worker stopped (STAGING.md § 4 to start it).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "refresh staging". Everything on staging is replaced by a copy of cs_dev.
        required: true
      first_run:
        description: First run only (STAGING.md § 1 step 15) — nothing is deployed to staging yet, so skip the web smoke test.
        type: boolean
        default: false

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  refresh:
    if: inputs.confirm == 'refresh staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      STAGING_BRANCH_ID: ${{ vars.NEON_STAGING_BRANCH_ID }}
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL || 'https://staging.rivalmonday.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the target (branch named staging, has a parent, owner URL is its direct endpoint)
        run: bash scripts/staging-target-check.sh

      - name: Stop the Railway staging worker, then refuse while any worker is connected (no job may run on the half-refreshed copy)
        # A worker left running would pick up dev's copied jobs before the clean-up below. It is the only cs_worker client,
        # and pg-boss keeps its connections open. `down` fails when nothing is deployed; the connection check decides.
        # CI cannot stop a local fallback worker (pnpm staging:up): that one the owner stops with Ctrl+C.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes @railway/cli@5.63.1 down --service rivalmonday-worker -y || echo "No active Railway deployment to remove."
          connected=unknown
          for _ in $(seq 1 18); do
            connected=$(psql "$DATABASE_URL" -XtAc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'cs_worker'")
            [ "$connected" = "0" ] && break
            sleep 10
          done
          if [ "$connected" != "0" ]; then
            echo "::error::A staging worker is still connected ($connected connections) 3 minutes after the Railway stop. Stop a local one (Ctrl+C), then run this again."
            exit 1
          fi

      - name: Reset the staging branch from its parent (cs_dev)
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json' "$@"; }
          ops=$(api -X POST -H 'Content-Type: application/json' -d "{\"source_branch_id\":\"$PARENT_BRANCH_ID\"}" \
            "$NEON_API/branches/$STAGING_BRANCH_ID/restore" | jq -r '.operations[].id')
          for op in $ops; do
            status=unknown
            for _ in $(seq 1 60); do
              status=$(api "$NEON_API/operations/$op" | jq -r .operation.status)
              case "$status" in
                finished|skipped) break ;;
                failed|error|cancelled) echo "::error::Neon operation $op ended $status"; exit 1 ;;
              esac
              sleep 5
            done
            case "$status" in finished|skipped) ;; *) echo "::error::Neon operation $op still $status after 5 minutes"; exit 1 ;; esac
          done

      - name: Re-apply the staging role passwords (the reset copied dev's back)
        # app_user/app_service/cs_worker/cs_web are SQL roles, so their passwords live in the copied data. \getenv keeps
        # the values off the command line; the owner holds ADMIN on these roles (it created them).
        env:
          PW_APP_USER: ${{ secrets.STAGING_PW_APP_USER }}
          PW_APP_SERVICE: ${{ secrets.STAGING_PW_APP_SERVICE }}
          PW_CS_WORKER: ${{ secrets.STAGING_PW_CS_WORKER }}
          PW_CS_WEB: ${{ secrets.STAGING_PW_CS_WEB }}
        run: |
          set -euo pipefail
          for v in PW_APP_USER PW_APP_SERVICE PW_CS_WORKER PW_CS_WEB; do
            [ -n "${!v}" ] || { echo "::error::secret STAGING_$v is not set in the staging environment"; exit 1; }
          done
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \getenv pw PW_APP_USER
          ALTER ROLE app_user PASSWORD :'pw';
          \getenv pw PW_APP_SERVICE
          ALTER ROLE app_service PASSWORD :'pw';
          \getenv pw PW_CS_WORKER
          ALTER ROLE cs_worker PASSWORD :'pw';
          \getenv pw PW_CS_WEB
          ALTER ROLE cs_web PASSWORD :'pw';
          SQL

      - name: Neutralise dev's sessions, webhooks, outbox and queued jobs
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/db/staging/after-refresh.sql

      - name: Refuse migrations that main does not have (branch work applied to cs_dev)
        # Every applied migration must be in main's journal: drizzle would otherwise skip older main migrations silently.
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -XtAc 'SELECT created_at FROM drizzle.__drizzle_migrations ORDER BY 1' | sed '/^$/d' > applied.txt
          jq -r '.entries[].when' packages/db/migrations/meta/_journal.json > journal.txt
          if extra=$(grep -vxFf journal.txt applied.txt); then
            echo "::error::cs_dev has migrations main lacks (created_at: $(echo $extra)). Merge that branch, then refresh again; keep the staging worker stopped."
            exit 1
          fi

      - name: Pre-deploy data check (migration 0025)
        run: pnpm --filter @cs/db predeploy-check

      - name: Migrate staging to main
        run: pnpm --filter @cs/db migrate

      - name: Smoke (staging app answers)
        if: ${{ !inputs.first_run }}
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$STAGING_APP_URL/health"
      - name: Redeploy the staging worker (Railway; waits until it is live)
        run: bash scripts/railway-deploy-worker.sh rivalmonday-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
