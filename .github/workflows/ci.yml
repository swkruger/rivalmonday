name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cs_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cs_test
      TEST_APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/cs_test
      TEST_SERVICE_DATABASE_URL: postgres://app_service:app_service@localhost:5432/cs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Create roles and test database
        run: psql postgres://postgres:postgres@localhost:5432/cs_dev -f infra/db/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --filter @cs/collectors exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright chromium for web E2E
        run: pnpm --filter @cs/web exec playwright install --with-deps chromium
      - name: Web E2E
        run: pnpm --filter @cs/web e2e
