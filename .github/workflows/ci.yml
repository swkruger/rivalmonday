name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cs_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cs_test
      TEST_APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/cs_test
      TEST_SERVICE_DATABASE_URL: postgres://app_service:app_service@localhost:5432/cs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Create roles (incl. runtime cs_worker/cs_web, which migration 0081 needs) and test database
        run: psql postgres://postgres:postgres@localhost:5432/cs_dev -f infra/db/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --filter @cs/collectors exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - name: Schema drift (drizzle-kit check)
        run: pnpm --filter @cs/db exec drizzle-kit check
      - run: pnpm test
      - name: Evals (recorded replies)
        run: pnpm eval:replay
      - name: Install Playwright chromium for web E2E
        run: pnpm --filter @cs/web exec playwright install --with-deps chromium
      - name: Web E2E
        run: pnpm --filter @cs/web e2e

  # Worker image: built from the repo root (turbo prune inside the Dockerfile), then smoke-tested offline
  # (loads ai.yaml, launches + closes Chromium; no DB, no network). No local Docker on the dev machine — this is the proof.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t rivalmonday-worker:ci .
      - name: Image smoke test
        run: docker run --rm --network none rivalmonday-worker:ci pnpm --filter @cs/worker smoke:image

  # Marketing site (apps/site): no database. Unit tests + typecheck already run in `test`. The build env matches
  # apps/site/playwright.config.ts (SERVER_ENV), because the E2E starts the server on this build (E2E_SKIP_BUILD=1).
  site:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://app.e2e.test
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      VERCEL_ENV: ""
      # Must equal SERVER_ENV in apps/site/playwright.config.ts (E2E_SKIP_BUILD reuses this build).
      NEXT_PUBLIC_COMPARE_PAGES: rivalmappd,brightlocal,local-falcon,birdeye
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cs/site lint
      - run: pnpm --filter @cs/site build
      - run: pnpm --filter @cs/site check:bundle
      - name: Install Playwright chromium for site E2E
        run: pnpm --filter @cs/site exec playwright install --with-deps chromium
      - name: Site E2E
        run: pnpm --filter @cs/site e2e
        env:
          E2E_SKIP_BUILD: "1"

  # Gated migrate-then-deploy (docs/DEPLOY.md). Any failed step stops every later one.
  # Off until the repo variable DEPLOY_ENABLED is 'true' (set once the prod accounts exist).
  deploy:
    needs: [test, image]
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-deploy data check (migration 0025)
        run: pnpm --filter @cs/db predeploy-check
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Migrate production database
        run: pnpm --filter @cs/db migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Vercel pull
        run: npx --yes vercel@62.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel build (uploads web source maps to Sentry)
        run: npx --yes vercel@62.4.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WEB }}
      - name: Vercel deploy
        run: npx --yes vercel@62.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Stamp worker release
        run: echo "$GITHUB_SHA" > apps/worker/.release
      - name: Railway deploy (worker)
        run: npx --yes @railway/cli@5.63.1 up --ci --service rivalmonday-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Sentry release (worker)
        run: |
          npx --yes @sentry/cli@3.8.0 releases new "$GITHUB_SHA"
          npx --yes @sentry/cli@3.8.0 releases finalize "$GITHUB_SHA"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WORKER }}

  # Marketing site (docs/DEPLOY.md § Marketing site). After `deploy` so the app's /api/waitlist and SITE_ORIGIN are live.
  # Same gate as `deploy`; refuses while OWNER-PLACEHOLDER markers remain (privacy, terms, founder note).
  deploy-site:
    needs: [site, deploy]
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-site
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse while placeholders remain
        run: pnpm --filter @cs/site check:placeholders
      - name: Refuse while any rival's facts are stale (> 90 days)
        # --all: every known rival, whether or not its page is on.
        run: pnpm --filter @cs/site check:facts --all
      - name: Vercel pull
        run: npx --yes vercel@62.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel build (uploads site source maps to Sentry)
        run: npx --yes vercel@62.4.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_SITE }}
      - name: Vercel deploy
        run: npx --yes vercel@62.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
