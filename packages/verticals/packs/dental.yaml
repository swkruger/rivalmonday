id: dental
name: Dental practices
version: 3
audience_noun: patients

services:
  - { id: cleaning_exam, name: Cleaning & exam, aliases: [checkup, hygiene visit, teeth cleaning] }
  - { id: new_patient_special, name: New patient special, aliases: [new patient offer, first visit special] }
  - { id: whitening, name: Teeth whitening, aliases: [zoom whitening, bleaching] }
  - { id: invisalign, name: Invisalign / clear aligners, aliases: [clear aligners, clear braces] }
  - { id: implants, name: Dental implants, aliases: [implant, all-on-4] }
  - { id: crowns, name: Crowns, aliases: [same-day crowns, cerec] }
  - { id: veneers, name: Veneers, aliases: [porcelain veneers] }
  - { id: root_canal, name: Root canal, aliases: [endodontics] }
  - { id: emergency_dental, name: Emergency dental, aliases: [same-day emergency, toothache] }
  - { id: pediatric, name: Pediatric dentistry, aliases: [kids dentist, children] }
  - { id: dentures, name: Dentures, aliases: [partials] }
  - { id: membership_plan, name: In-house membership plan, aliases: [dental savings plan, no insurance plan] }
  - { id: sedation, name: Sedation dentistry, aliases: [sleep dentistry, nitrous] }

themes:
  - { id: wait_time, name: Wait time, description: Time spent waiting in the office past the appointment time }
  - { id: billing_insurance, name: Billing & insurance, description: Surprise bills, insurance handling, cost clarity }
  - { id: staff_friendliness, name: Staff friendliness, description: Warmth and helpfulness of front desk and clinical staff }
  - { id: pain_comfort, name: Pain & comfort, description: Gentleness, anxiety handling, comfort during treatment }
  - { id: upsell_pressure, name: Upsell pressure, description: Pushing unnecessary treatment or cosmetic add-ons }
  - { id: appointment_availability, name: Appointment availability, description: Ease of booking, same-week availability }
  - { id: results_quality, name: Results quality, description: Outcome of treatment, aesthetics, durability }
  - { id: cleanliness, name: Cleanliness, description: Clean, modern office and hygiene practices }

type_weights:
  price_change: 0.9
  promo: 0.9
  new_service: 0.8
  service_removed: 0.4
  service_area_change: 0.6
  new_location: 1.0
  hiring: 0.5
  ad_started: 0.6
  ad_stopped: 0.3
  review_spike: 0.6
  rating_change: 0.8
  rank_change: 0.5
  content: 0.2
  cosmetic: 0.0

move_thresholds:
  hiring_push_postings_30d: 2
  rating_drop_90d: 0.15
  ad_surge_multiplier: 2.0
  complaint_spike_multiplier: 2.0
  price_war_cuts_90d: 2
  ad_burst_starts_30d: 3
  promo_blitz_window_days: 14

scoring:
  version: 2
  routing: { alert: 70, brief: 40 }
  size:
    { default: 0.6, price_pct_for_full: 25, price_min: 0.3, ads_for_full: 5, jobs_for_full: 5, review_z_for_full: 4, rating_delta_for_full: 0.3, rank_delta_for_full: 5, structured_min: 0.3 }
  relevance: { matched: 1.0, unmapped: 0.6, unmatched: 0.2, outside_territory: 0.3 }
  novelty_similarity_floor: 0.5
  novelty_window_days: 365
  alert_max_age_days: 7

discovery:
  seed_keywords: [dentist, dental implants, emergency dentist]
  categories: [Dentist, Cosmetic dentist, Dental clinic, Emergency dental service, Pediatric dentist, Denture care center, Dental implants provider, Prosthodontist]
  related_categories: [Orthodontist, Oral and maxillofacial surgeon, Oral surgeon, Periodontist, Endodontist]
  grid: { size: 7, fallback_size: 5 }
  shortlist: 20
  cost_cap_usd: 3
  tiers: { top: { overlap: 0.55, activity: 0.25 }, watch: { overlap: 0.35, activity: 0.6 } }

playbooks:
  - id: new_patient_offer_response
    trigger: promo
    title: Answer a new-patient offer
    template: >-
      {{competitor}} launched a new-patient offer. Match on perceived value rather than price: bundle exam, cleaning and
      X-rays with a clear total, and feature it on your booking page and Google Business Profile.
  - id: price_war_membership
    trigger: price_war
    title: Use a membership plan instead of discounting
    template: >-
      {{competitor}} keeps discounting. Promote your in-house membership plan for uninsured patients with a simple
      annual price, rather than cutting individual treatment prices.
  - id: territory_new_location
    trigger: territory_expansion
    title: Respond to a nearby new location
    template: >-
      {{competitor}} is moving into {{areas}}. Refresh location pages for those neighbourhoods, ask recent patients
      from those ZIP codes for reviews, and target them with a new-patient offer for 60 days.
  - id: new_service_cosmetic
    trigger: new_service_line
    title: Respond to a new treatment offering
    template: >-
      {{competitor}} now offers {{service}}. If you provide it, publish a dedicated page with before/after cases and
      financing; if not, prepare a referral pathway and FAQ answer for the front desk.
  - id: hiring_push_capacity
    trigger: hiring_push
    title: Prepare for added competitor capacity
    template: >-
      {{competitor}} is hiring (e.g. hygienists or associates), signalling expanded capacity. Protect recall
      appointments with reminders and consider opening extra hygiene slots.
  - id: promo_blitz_counter
    trigger: promo_blitz
    title: Counter a promo blitz
    template: >-
      {{competitor}} is promoting across channels. Run one clear, time-limited offer on a high-value service
      (e.g. whitening with cleaning) and email lapsed patients.
  - id: reputation_slump_capture
    trigger: reputation_slump
    title: Win patients unhappy with a competitor
    template: >-
      {{competitor}}'s reviews show rising complaints about {{theme}}. Emphasise your strength on {{theme}} in ads
      and on your homepage, backed by recent reviews that mention it.
  - id: ad_surge_watch
    trigger: ad_surge
    title: Protect visibility during an ad surge
    template: >-
      {{competitor}} has sharply increased advertising. Protect branded search terms and check that your new-patient
      offer is visible in the same areas.
  - id: ask_for_reviews
    effort: L
    impact: H
    trigger: review_velocity_gap
    title: Ask more patients for a review
    template: >-
      Ask every patient for a Google review at checkout with a text link, and aim for a few new reviews each week.
  - id: reply_to_reviews
    effort: L
    impact: M
    trigger: reply_rate_gap
    title: Reply to your reviews
    template: >-
      Reply to every new review within two days, starting with the last 20.
  - id: fix_top_complaint
    effort: M
    impact: H
    trigger: rating_gap
    title: Fix the most common complaint
    template: >-
      Read your lowest reviews from the last 90 days, pick the complaint patients repeat most, and fix it this month.
  - id: consider_search_ads
    effort: M
    impact: M
    trigger: rival_only_advertiser
    title: Try a small Google search ads budget
    template: >-
      Run a small Google search campaign for "dentist near me" in your town so new patients can find you next to those rivals.
  - id: fix_theme
    effort: M
    impact: M
    trigger: theme_weakness
    title: Address a weak spot patients notice
    template: >-
      Name one change to fix {{theme}}, tell your team, and ask happy patients who notice it to say so in their review.
  - id: promote_strength
    effort: L
    impact: M
    trigger: theme_strength
    title: Promote what patients praise
    template: >-
      Feature {{theme}} as a strength on your website and Google profile, with a short quote from a patient review.
  - id: improve_map_rank
    effort: M
    impact: H
    trigger: map_visibility_gap
    title: Climb the Google map results
    template: >-
      Add fresh photos, answer questions and post an update on your Google profile each week, and make sure your name, address and phone match everywhere online.
  - id: complete_profile
    effort: L
    impact: M
    trigger: profile_gap
    title: Complete your Google profile
    template: >-
      Claim your Google profile and fill in your hours, services and extra categories so patients see a complete listing.

self_rules:
  - { id: review_velocity_gap, weight: 1.0, playbook: ask_for_reviews, params: { ratio: 0.5 } }
  - { id: reply_rate_gap, weight: 0.8, playbook: reply_to_reviews, params: { gap: 0.25 } }
  - { id: rating_gap, weight: 0.9, playbook: fix_top_complaint, params: { gap: 0.2 } }
  - { id: rival_only_advertiser, weight: 0.6, playbook: consider_search_ads }
  - { id: theme_weakness, weight: 0.7, playbook: fix_theme, params: { gap: 0.1 } }
  - { id: theme_strength, weight: 0.5, playbook: promote_strength, strength: true, params: { gap: 0.1 } }
  - { id: map_visibility_gap, weight: 0.8, playbook: improve_map_rank, params: { gap: 0.1 } }
  - { id: profile_gap, weight: 0.7, playbook: complete_profile, params: { min_categories: 2 } }
